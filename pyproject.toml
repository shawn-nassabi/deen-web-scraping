[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deen-scraper"
version = "0.1.0"
description = "Web scraping, PDF parsing, text cleaning, and vector indexing pipeline for Islamic hadith collections."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "PyMuPDF",
    "Pillow",
    "ocrmac",
    "pinecone",
    "sentence-transformers",
    "scikit-learn",
    "langchain",
    "langchain-text-splitters",
    "playwright",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
